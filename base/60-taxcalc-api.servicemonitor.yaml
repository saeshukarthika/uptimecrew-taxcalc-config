# manifests/observability/taxcalc-api-servicemonitor.yaml - tells the
# Prometheus Operator to scrape taxcalc-api's /actuator/prometheus endpoint.
#
# CRITICAL: the `release: kube-prometheus-stack` label on THIS object
# (not just the selector below) is required - the Operator's own
# ServiceMonitorSelector is scoped to that label by default. Miss it and
# the scrape config is silently never generated: no error, just no data.

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taxcalc-api
  namespace: taxcalc-dev
  labels:
    app.kubernetes.io/name:       taxcalc-api
    app.kubernetes.io/component:  api
    app.kubernetes.io/part-of:    taxcalc
    app.kubernetes.io/managed-by: kubectl
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: taxcalc-api
  endpoints:
    - port: http                  # the named Service port, not a number
      path: /actuator/prometheus
      interval: 15s